name: EcoLeak CI

on:
  push:
    branches: [main, phase2-fixes, phase3-readiness]
  pull_request:
  workflow_dispatch:

jobs:
  postgres-suite:
    name: Backend + engine suites (PostgreSQL 16 service)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecoleak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ecoleak_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ecoleak_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned environment (requirements.lock)
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.lock

      - name: Backend PG-gated suite (contract parity, schema constraints, ingestion volume, audit, double counting, Module P real)
        working-directory: backend
        run: python -m pytest tests/ -q

      - name: P3 SQL-backed source + flag + property suites (PG)
        working-directory: .
        run: |
          python -m pytest tests/test_sql_source.py tests/test_data_source_flag.py \
                 tests/test_properties.py tests/test_unit_dimensions.py \
                 tests/test_recycling_emissions.py tests/test_real_factors.py -q
          python -m pytest tests/test_p4_phase2_integration.py -q

      - name: Mock shape gates
        run: |
          python validate_mocks.py
          python validate_against_mock.py
          python tools/phase2_p3_shape_diff.py
          python tools/phase2_p4_shape_diff.py

      - name: Frontend build (tsc --noEmit + vite)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  K1-adversarial:
    name: K1 red/green adversarial (fixed + broken dual-state)
    runs-on: ubuntu-latest
    env:
      USE_MOCK_DATA: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install python deps (repo root)
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.lock
      - name: Install root test tooling (playwright-core) at repo root
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install chromium --only-shell
      - name: Install node deps (frontend/)
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Seed fixed + broken DBs, build both UI variants (fresh, no caches)
        run: |
          rm -rf frontend/dist frontend/dist-broken frontend/node_modules/.vite
          python -m tools.seed_sql_lite var/ecoleak.sqlite3
          python -m tools.seed_sqlite_broken
          cd frontend
          VITE_USE_MOCK_DATA=auto VITE_API_URL=http://localhost:8000 npm run build
          VITE_USE_MOCK_DATA=auto VITE_API_URL=http://localhost:8001 npx vite build --outDir dist-broken
          # env-baking guard: the baked URL must exist in each bundle
          python - <<'PY2'
          import glob
          fixed = open(glob.glob('dist/assets/index-*.js')[0], encoding='utf-8', errors='ignore').read()
          broken = open(glob.glob('dist-broken/assets/index-*.js')[0], encoding='utf-8', errors='ignore').read()
          assert 'localhost:8000' in fixed and 'localhost:8001' not in fixed, 'FIXED bundle env-baking broken'
          assert 'localhost:8001' in broken and 'localhost:8000' not in broken, 'BROKEN bundle env-baking broken'
          print('env baking guard PASS')
          PY2
      - name: RED/GREEN strict per-id + UI dual-state (servers and checks in one shell)
        run: |
          CORS_ALLOW_ORIGINS="http://localhost:5174,http://localhost:5175" USE_MOCK_DATA=false ENGINE_DSN="sqlite+pysqlite:///./var/ecoleak.sqlite3" python -m uvicorn app.main:app --app-dir backend --port 8000 &
          CORS_ALLOW_ORIGINS="http://localhost:5174,http://localhost:5175" USE_MOCK_DATA=false ENGINE_DSN="sqlite+pysqlite:///./var/ecoleak_broken.sqlite3" python -m uvicorn app.main:app --app-dir backend --port 8001 &
          node tests/static_server.mjs frontend/dist 5174 &
          node tests/static_server.mjs frontend/dist-broken 5175 &
          sleep 12
          # --- checks run in the SAME shell so the background servers are alive ---
          # fixed: MUST pass
          node tests/k1_strict.mjs http://localhost:8000
          # broken: MUST fail (red) â€” invert to make CI red/green visible
          if node tests/k1_strict.mjs http://localhost:8001 2>/dev/null; then
            echo "FAIL: broken backend must NOT pass strict checks"; exit 1
          fi
          # UI: fixed shows engine label, broken shows fallback label
          node tests/k1_ui.mjs

  p2_migration_and_seed_smoke:
    name: P2 migration + seed smoke (PostgreSQL 16 service)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecoleak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ecoleak
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.lock
      - name: Alembic upgrade + full 19-intervention seed + engine-over-PG smoke
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m app.seed.run_seed
          cd ..
          python - <<'PY'
          from sqlalchemy import create_engine
          from engine.sql_source import SQLActivityDataSource
          from engine.service import EcoLeakEngine
          pg = create_engine("postgresql+psycopg://postgres:postgres@localhost:5432/ecoleak")
          src = SQLActivityDataSource(pg)
          fid = str(src.list_facilities()[0].id); pid = str(src.list_reporting_periods(fid)[0].id)
          inv = EcoLeakEngine(data_source=src).calculate_inventory(fid, pid)
          assert str(inv.operational_kgco2e) == "566360.800000", inv.operational_kgco2e
          assert len(src.get_interventions()) == 19
          print("PG smoke OK: op =", inv.operational_kgco2e, "| interventions =", len(src.get_interventions()))
          PY

  lint-and-naive-pytest:
    name: Lint + naive pytest entrypoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.lock
      - name: Backend ruff gate
        working-directory: backend
        run: python -m ruff check app
      - name: Root suite via configured testpaths (naive pytest)
        run: python -m pytest -q
